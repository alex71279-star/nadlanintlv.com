name: Analyze property markup

on:
  push:
    branches:
      - base44-property-sync
    paths:
      - '.github/workflows/analyze-property-markup.yml'

permissions:
  contents: write

jobs:
  analyze:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract property-related markup context
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, json
          text = Path('index.html').read_text(encoding='utf-8', errors='replace')
          terms = ['property', 'properties', 'listing', 'featured', 'Hayarkon', 'Rothschild', 'Neve Tzedek', 'נכס', 'נכסים']
          out = {'length': len(text), 'matches': []}
          for term in terms:
              for m in list(re.finditer(re.escape(term), text, re.I))[:20]:
                  s=max(0,m.start()-500); e=min(len(text),m.end()+900)
                  out['matches'].append({'term': term, 'context': text[s:e]})
          Path('.integration-analysis.json').write_text(json.dumps(out, ensure_ascii=False, indent=2), encoding='utf-8')
          PY
      - name: Commit analysis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .integration-analysis.json
          git commit -m "Analyze property markup for Base44 sync" || exit 0
          git push
