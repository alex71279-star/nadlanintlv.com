name: Extract property context

on:
  workflow_dispatch:
  push:
    branches:
      - base44-property-sync
    paths:
      - '.github/workflows/extract-property-context.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract relevant HTML context
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          text = p.read_text(encoding='utf-8', errors='replace')
          terms = [
              'property', 'properties', 'listing', 'featured',
              'Hayarkon', 'Rothschild', 'Neve Tzedek',
              'נכס', 'נכסים', 'דירה', 'דירות'
          ]
          sections = []
          seen = set()
          for term in terms:
              for m in list(re.finditer(re.escape(term), text, re.I))[:30]:
                  s = max(0, m.start() - 1400)
                  e = min(len(text), m.end() + 2400)
                  key = (s // 500, e // 500)
                  if key in seen:
                      continue
                  seen.add(key)
                  sections.append(f'\n\n===== TERM: {term} @ {m.start()} =====\n{text[s:e]}')
          out = 'INDEX_LENGTH=' + str(len(text)) + '\n' + ''.join(sections)
          Path('property-context.txt').write_text(out[:180000], encoding='utf-8')
          PY
      - name: Commit extracted context
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add property-context.txt
          git commit -m "Extract property markup context" || exit 0
          git push
