name: Test Base44 public properties

on:
  push:
    branches:
      - base44-property-sync
    paths:
      - '.github/workflows/test-base44-loader.yml'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test anonymous Base44 function
        run: |
          mkdir -p /tmp/base44-test
          cd /tmp/base44-test
          npm init -y >/dev/null 2>&1
          npm install @base44/sdk@0.8.40 >/dev/null 2>&1
          cat > test.mjs <<'JS'
          import { createClient } from '@base44/sdk';
          import { writeFileSync } from 'node:fs';

          const base44 = createClient({ appId: '6a8427f2fbe193e7355b37b9' });
          try {
            const response = await base44.functions.invoke('getPublicProperties', {});
            const payload = response?.data ?? response ?? {};
            const items = Array.isArray(payload?.properties)
              ? payload.properties
              : Array.isArray(payload?.data?.properties)
                ? payload.data.properties
                : [];
            const result = {
              ok: items.length > 0,
              count: items.length,
              fields: items[0] ? Object.keys(items[0]).sort() : []
            };
            writeFileSync(process.env.GITHUB_WORKSPACE + '/integration-test-result.json', JSON.stringify(result, null, 2));
            if (!result.ok) process.exit(2);
          } catch (error) {
            writeFileSync(process.env.GITHUB_WORKSPACE + '/integration-test-result.json', JSON.stringify({ ok:false, error:String(error?.message || error) }, null, 2));
            process.exit(1);
          }
          JS
          node test.mjs
      - name: Commit test result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integration-test-result.json
          git commit -m "Record Base44 public function test" || exit 0
          git push
