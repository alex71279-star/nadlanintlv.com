name: Extract readable properties

on:
  push:
    branches:
      - base44-property-sync
    paths:
      - '.github/workflows/extract-readable-properties.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract readable HTML and scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8', errors='replace')

          start = text.find('<section id="properties"')
          if start == -1:
              raise SystemExit('properties section not found')
          next_section = text.find('<section', start + 20)
          end = next_section if next_section != -1 else text.find('</body>', start)
          section = text[start:end]

          # Replace embedded data URIs so the extract stays readable.
          section = re.sub(r'data:image/[^;]+;base64,[A-Za-z0-9+/=]+', 'DATA_IMAGE_REMOVED', section)
          section = section.replace('><', '>\n<')
          Path('properties-readable.html').write_text(section, encoding='utf-8')

          # Extract only inline scripts; strip any huge embedded data images there too.
          scripts = '\n\n'.join(re.findall(r'<script[^>]*>(.*?)</script>', text, flags=re.I|re.S))
          scripts = re.sub(r'data:image/[^;]+;base64,[A-Za-z0-9+/=]+', 'DATA_IMAGE_REMOVED', scripts)
          Path('scripts-readable.js').write_text(scripts, encoding='utf-8')
          PY
      - name: Commit readable extracts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add properties-readable.html scripts-readable.js
          git commit -m "Extract readable property markup" || exit 0
          git push
